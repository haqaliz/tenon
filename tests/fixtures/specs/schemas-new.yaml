openapi: 3.0.3
info:
  title: Schemas new
  version: 1.0.0
paths:
  /users:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, age, team]
              properties:
                name:
                  type: string
                age:
                  type: integer
                role:
                  type: string
                  enum: [admin, user]
                scope:
                  type: string
                  enum: [read, write]
                kind:
                  type: string
                  enum: [b, a]
                address:
                  type: object
                  properties:
                    street:
                      type: string
                    zip:
                      type: integer
                tags:
                  type: array
                  items:
                    type: integer
                email:
                  type: string
                team:
                  type: string
      responses:
        "201":
          description: Created
  /users/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
