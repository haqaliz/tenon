[project]
name = "tenonhq"
version = "0.0.1"
description = "Keep your code fitted to the APIs it depends on."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
